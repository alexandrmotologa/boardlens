[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boardlens"
version = "0.1.0"
description = "Virtual microcontroller and hardware logic simulator for embedded systems developers"
readme = "README.md"
authors = [{ name = "Alexandr Motologa", email = "alexandr@mtlg.site" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "riscv",
    "rv32i",
    "cortex-m",
    "emulator",
    "simulator",
    "hardware",
    "embedded",
    "i2c",
    "uart",
    "ssd1306",
    "vcd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Emulators",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
boardlens = "boardlens.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=boardlens --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
